name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Prepare files
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp icon.png resources/icon.png
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - name: Android 8 to 16 (minSdk 26, targetSdk 36)
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          cat android/variables.gradle
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: test-6-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
